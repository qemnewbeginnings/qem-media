<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:340px;margin:12px;color:#222}
h1{font-size:16px;margin:0 0 8px;color:#5e35b1}
button{font-size:14px;padding:8px 10px;margin:4px 4px 0 0;border-radius:6px;border:1px solid #888;cursor:pointer;background:#fff}
.main{background:#5e35b1;color:#fff;border-color:#5e35b1}
.row{margin:8px 0}.box{background:#f3f0fa;border-radius:8px;padding:8px;margin-top:8px}
.small{font-size:12px}.big{font-size:20px;font-weight:700}
input[type=number]{width:48px;font-size:14px}
</style></head><body>
<h1>👻 QEM Ghost Maker</h1>
<div class="box" style="margin-top:0">
  <div style="font-weight:700">On the Nifty item you have open:</div>
  <div class="row"><button id="practice" class="main">1. Practice (no credits)</button></div>
  <div class="row"><button id="real">2. Make the ghost (5 credits)</button></div>
  <div class="row"><button id="scout">Scout this page</button> <span class="small">copies what it sees</span></div>
</div>
<div class="box">
  <label style="font-weight:700"><input type="checkbox" id="auto"> Auto: make Denny's ghosts</label>
  <div class="small" style="margin-top:4px">Checks every 20 min, 8am to 8:45pm, skips Chrome Claude times. Stops and turns off at the first problem.</div>
  <div class="row small">Ghosts a day: <input type="number" id="cap" min="1" max="40"> · Today: <b id="today">0</b></div>
  <div class="row" style="margin-bottom:0"><button id="checknow">Check ghost list now</button></div>
</div>
<div class="row"><button id="stop">Stop</button><button id="clearbad">Clear problems</button></div>
<div class="box"><div>Waiting: <span class="big" id="left">0</span> · Made: <span class="big" id="done">0</span> · Problems: <span class="big" id="bad">0</span></div>
<div id="status" style="margin-top:6px">Idle</div></div>
<div class="row"><button id="copy">Copy report</button></div>
<script src="popup.js"></script></body></html>
